version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - set -euo pipefail
      - TF_VERSION=1.9.8
      - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/tf.zip
      - unzip -o /tmp/tf.zip -d /usr/local/bin
      - terraform version
      - npm install -g yarn

  pre_build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR"
      - yarn install

  build:
    commands:
      - set -euo pipefail
      - cd "$CODEBUILD_SRC_DIR"
      - yarn deploy:ci
